# Project information
site_name: Data Deck docs
site_url: https://example.com/data-deck/docs
site_author: Data Deck
site_description: >-
  Data Deck is a browser-only tool for importing, exploring, cleaning,
  visualizing, and reporting on both time-series and general tabular data.
  Nothing leaves your browser.

# Repository
repo_name: data-deck
repo_url: https://github.com/your-org/data-deck

# Copyright
copyright: Copyright &copy; Data Deck contributors

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/overview.md
      - Bare metal: getting-started/bare-metal.md
      - Docker: getting-started/docker.md
      - Configuration (config.json): getting-started/configuration.md
  - Sources (time-series):
      - Overview: sources/index.md
      - Importing data: sources/import.md
      - Source groups: sources/groups.md
      - Parameters & thresholds: sources/parameters.md
      - Browsing & editing data: sources/data.md
      - Extracts: sources/extracts.md
      - Charts & anomaly detection: sources/charts.md
  - Datasets (tabular & ML):
      - Overview: datasets/index.md
      - Importing data: datasets/import.md
      - Exploring data: datasets/explore.md
      - Cleaning & preprocessing: datasets/preprocessing.md
      - Joining & appending: datasets/combining.md
      - PCA & clustering: datasets/pca-clustering.md
      - Baseline model: datasets/baseline-model.md
      - Data quality & validation: datasets/data-quality.md
  - Reports:
      - Overview: reports/index.md
      - Simple mode: reports/simple-mode.md
      - Advanced mode (blocks): reports/advanced-mode.md
      - Branding & export: reports/branding-export.md
  - Bridges between workspaces: bridges.md
  - Project & data management:
      - Save / load a project: project/save-load.md
      - Activity log: project/activity-log.md
      - Data dictionary: project/data-dictionary.md
  - Deployment:
      - Docker & bare metal: deployment/hosting.md
      - GitHub integration: deployment/github-integration.md
      - Bug reporting: deployment/bug-reporting.md
  - Privacy & architecture: privacy.md
  - About: about.md

validation:
  links:
    anchors: warn

theme:
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections: false
    - navigation.expand: false
    - navigation.top
    - navigation.path
    - search.highlight
    - search.suggest
    - toc.follow
    - toc.integrate
  hide:
    - toc
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      accent: purple
      primary: black
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: purple
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: purple
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      style_plain_text: python
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: "¤"

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - js/init-mermaid.js
extra_css:
  - assets/stylesheets/extra.css
